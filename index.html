<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>D&D Python Server Test</title>
    <style>
        body { background: #181825; color: #cdd6f4; font-family: sans-serif; padding: 16px; margin: 0; }
        .card { background: #1e1e2e; border: 1px solid #313244; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 15px; }
        .dice-val { font-size: 42px; font-weight: bold; text-align: center; color: #cba6f7; margin: 10px 0; }
        button { width: 100%; padding: 14px; background: #cba6f7; color: #11111b; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.85; }
        .log-item { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #313244; color: #a6adc8; }
        .status-ok { color: #a6e3a1; font-size: 12px; }
        .status-err { color: #f38ba8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="hero-name" style="margin:0;">Подключение к ноутбуку...</h3>
            <span id="conn-status" class="status-ok">⏳</span>
        </div>
        <div class="row"><span>Класс:</span> <b id="hero-class">—</b></div>
        <div class="row"><span>Здоровье (HP):</span> <b id="hero-hp">—</b></div>
        <div class="row"><span>Класс Доспеха (AC):</span> <b id="hero-ac">—</b></div>
        <div class="row"><span>Бонус атаки (Сила):</span> <b id="hero-mod">—</b></div>
    </div>

    <div class="card">
        <div id="dice-display" class="dice-val">🎲</div>
        <button onclick="rollOnServer()">⚔️ Атаковать (расчёт на Python)</button>
    </div>

    <div class="card">
        <b style="display:block; margin-bottom:8px;">Общий журнал комнаты (с ноутбука):</b>
        <div id="party-log">Ожидание ответа сервера...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 👇 ВСТАВЬТЕ СЮДА ССЫЛКУ ИЗ ТЕРМИНАЛА PYTHON (без слэша на конце)
        const SERVER_URL = "https://ВАША-ССЫЛКА.trycloudflare.com";

        const user = tg.initDataUnsafe?.user || { id: 777000, first_name: "Путник (Браузер)" };

        async function loadState() {
            try {
                const res = await fetch(`${SERVER_URL}/api/state`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: user.id, username: user.first_name })
                });
                const data = await res.json();

                if (!data.allowed) {
                    document.body.innerHTML = `<div class="card status-err"><h3>⛔ ${data.error}</h3></div>`;
                    return;
                }

                document.getElementById("conn-status").innerText = "🟢 Онлайн";
                document.getElementById("hero-name").innerText = data.hero.name;
                document.getElementById("hero-class").innerText = data.hero.class_level;
                document.getElementById("hero-hp").innerText = data.hero.hp;
                document.getElementById("hero-ac").innerText = data.hero.ac;
                document.getElementById("hero-mod").innerText = `+${data.hero.str_mod}`;
                renderLog(data.log);
            } catch (e) {
                document.getElementById("conn-status").innerHTML = `<span class="status-err">🔴 Сервер недоступен</span>`;
                document.getElementById("party-log").innerText = "Проверьте, запущен ли server.py и правильная ли ссылка в SERVER_URL.";
            }
        }

        async function rollOnServer() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");

            const res = await fetch(`${SERVER_URL}/api/roll`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: user.id, username: user.first_name })
            });
            const data = await res.json();

            if (data.allowed) {
                document.getElementById("dice-display").innerText = `${data.total} (куб: ${data.d20})`;
                renderLog(data.log);
            }
        }

        function renderLog(logs) {
            const container = document.getElementById("party-log");
            container.innerHTML = logs.map(item => `<div class="log-item">${item}</div>`).join("");
        }

        loadState();
    </script>
</body>
</html>
