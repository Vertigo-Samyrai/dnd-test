<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>D&D Tavern Mini App</title>
    <style>
        body {
            background: #181825;
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .card {
            background: #1e1e2e;
            border: 1px solid #313244;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 15px;
        }
        .dice-val {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            color: #cba6f7;
            margin: 12px 0;
            min-height: 50px;
        }
        .crit-hit { color: #a6e3a1; }
        .crit-miss { color: #f38ba8; }
        button {
            width: 100%;
            padding: 14px;
            background: #cba6f7;
            color: #11111b;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        button:disabled { background: #45475a; color: #7f849c; cursor: not-allowed; }
        .log-item {
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #313244;
            color: #a6adc8;
        }
        .status-ok { color: #a6e3a1; font-size: 12px; font-weight: bold; }
        .status-err { color: #f38ba8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-row">
            <h3 id="hero-name" style="margin:0;">Подключение к серверу...</h3>
            <span id="conn-status" class="status-ok">⏳</span>
        </div>
        <div class="row"><span>Класс и уровень:</span> <b id="hero-class">—</b></div>
        <div class="row"><span>Здоровье (HP):</span> <b id="hero-hp">—</b></div>
        <div class="row"><span>Класс Доспеха (AC):</span> <b id="hero-ac">—</b></div>
        <div class="row"><span>Бонус атаки (Сила):</span> <b id="hero-mod">—</b></div>
    </div>

    <div class="card">
        <div id="dice-display" class="dice-val">🎲</div>
        <button id="roll-btn" onclick="rollOnServer()">⚔️ Атаковать (расчёт на Python)</button>
    </div>

    <div class="card">
        <div class="header-row">
            <b>Общий журнал комнаты:</b>
            <span style="font-size:12px; color:#6c7086; cursor:pointer;" onclick="loadState()">🔄 Обновить</span>
        </div>
        <div id="party-log">Ожидание ответа от ноутбука...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Автоматически получаем актуальную ссылку туннеля из параметра ?api=... от бота
        const urlParams = new URLSearchParams(window.location.search);
        const apiFromUrl = urlParams.get("api");

        if (apiFromUrl) {
            localStorage.setItem("dnd_server_url", apiFromUrl.replace(/\/$/, ""));
        }

        const SERVER_URL = apiFromUrl
            ? apiFromUrl.replace(/\/$/, "")
            : localStorage.getItem("dnd_server_url");

        // 2. Получаем данные игрока из Telegram (в коде нет чужих ID или секретов)
        const user = tg.initDataUnsafe?.user || { id: 777000, first_name: "Путник (Браузер)" };

        async function loadState() {
            if (!SERVER_URL) {
                document.getElementById("conn-status").innerHTML = `<span class="status-err">🔴 Нет ссылки API</span>`;
                document.getElementById("party-log").innerText =
                    "Запустите server.py на ноутбуке и заново откройте приложение через кнопку в боте.";
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/state`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: user.id, username: user.first_name })
                });
                const data = await res.json();

                if (!data.allowed) {
                    document.body.innerHTML = `<div class="card status-err"><h3>⛔ ${data.error}</h3></div>`;
                    return;
                }

                document.getElementById("conn-status").innerText = "🟢 Онлайн";
                document.getElementById("hero-name").innerText = data.hero.name;
                document.getElementById("hero-class").innerText = data.hero.class_level;
                document.getElementById("hero-hp").innerText = data.hero.hp;
                document.getElementById("hero-ac").innerText = data.hero.ac;
                document.getElementById("hero-mod").innerText = `+${data.hero.str_mod}`;
                renderLog(data.log);
            } catch (e) {
                document.getElementById("conn-status").innerHTML = `<span class="status-err">🔴 Офлайн</span>`;
                document.getElementById("party-log").innerText =
                    "Сервер на ноутбуке не отвечает. Если вы перезапускали server.py, закройте и заново откройте окно в Telegram.";
            }
        }

        async function rollOnServer() {
            if (!SERVER_URL) return;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");

            const btn = document.getElementById("roll-btn");
            btn.disabled = true;

            try {
                const res = await fetch(`${SERVER_URL}/api/roll`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: user.id, username: user.first_name })
                });
                const data = await res.json();

                if (data.allowed) {
                    const diceEl = document.getElementById("dice-display");
                    diceEl.className = "dice-val";

                    if (data.d20 === 20) {
                        diceEl.innerText = `🔥 ${data.total} (нат. 20!)`;
                        diceEl.classList.add("crit-hit");
                    } else if (data.d20 === 1) {
                        diceEl.innerText = `💀 Провал (нат. 1)`;
                        diceEl.classList.add("crit-miss");
                    } else {
                        diceEl.innerText = `${data.total} (куб: ${data.d20})`;
                    }

                    renderLog(data.log);
                }
            } catch (e) {
                document.getElementById("conn-status").innerHTML = `<span class="status-err">🔴 Ошибка связи</span>`;
            } finally {
                btn.disabled = false;
            }
        }

        function renderLog(logs) {
            const container = document.getElementById("party-log");
            container.innerHTML = logs.map(item => `<div class="log-item">${item}</div>`).join("");
        }

        loadState();
        // Автоматически обновляем журнал комнаты каждые 4 секунды, чтобы видеть броски друзей
        setInterval(loadState, 4000);
    </script>
</body>
</html>
